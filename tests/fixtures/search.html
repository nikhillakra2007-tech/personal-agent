<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Search</title></head>
<body>
<h1>Search</h1>
<form id="search-form">
<label for="q-search">Search</label>
<input type="text" id="q-search" name="q">
<button type="submit" id="q-go">Search</button>
</form>
<div id="q-results">no results yet</div>
<script>
document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    document.getElementById("q-results").innerText = "Cathedral results: nave, tower";
});
</script>
</body>
</html>
